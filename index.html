<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge AI 반도체 내 탑재 AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf7ff;color:#233d55;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}
main{width:min(820px,100%);background:#fff;border:1px solid #d7eafa;border-radius:28px;box-shadow:0 16px 50px #bfd9ec66;overflow:hidden}
header{padding:26px;background:#e1f2ff}
h1{font-size:clamp(20px,4vw,27px);margin:0 0 10px}
p{line-height:1.6;margin:8px 0;font-size:14px}
.tag{display:inline-block;font-size:12px;background:#fff;border-radius:20px;padding:6px 10px;margin-bottom:12px}
.loading{padding:16px 24px;border-bottom:1px solid #e6eff6}
#status{font-weight:700}
progress{width:100%;height:12px;accent-color:#529bd4}
#detail{white-space:pre-wrap;overflow-wrap:anywhere;color:#58738b;font-size:12px}
#chat{height:370px;height:clamp(240px,43dvh,500px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.message{max-width:88%;align-self:flex-start}
.message.user{align-self:flex-end}
.label{font-size:11px;color:#58738b;margin:0 8px 5px}
.user .label{text-align:right}
.bubble{background:#f0f6fb;border-radius:18px 18px 18px 5px;padding:12px 16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.user .bubble{background:#dcefff;border-radius:18px 18px 5px 18px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 22px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;background:#326d9d;color:white;padding:12px 18px}
.suggestions button{background:#f1f8ff;border:1px solid #cee3f5;color:#315b7c;font-size:12px;padding:9px 12px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,textarea:focus-visible{outline:3px solid #508cc0;outline-offset:3px}
form{display:flex;gap:10px;padding:14px 22px}
textarea{resize:vertical;min-height:54px;max-height:150px;flex:1;min-width:0;border:1px solid #c9dfef;border-radius:15px;padding:14px;font:inherit;color:inherit;background:#fcfeff}
footer{padding:0 22px 18px;font-size:11px;color:#627e94}
@media(max-width:520px){body{padding:8px}header{padding:20px}form{padding:12px}#chat{padding:14px}.message{max-width:94%}}
</style>
</head>
<body>
<main>
<header>
<span class="tag">☁️ 내 브라우저 속 작은 AI</span>
<h1>edge AI 반도체 내 탑재 AI</h1>
<p>작은 칩으로 시작하는 커다란 호기심!<br>엣지 AI와 반도체를 함께 배워 봐요.</p>
</header>
<section class="loading" aria-label="모델 준비 상태">
<div id="status" role="status">AI 준비 중 · 0%</div>
<progress id="progress" value="0" max="100" aria-label="모델 로딩 진행률"></progress>
<p id="detail">WebLLM을 불러오고 있어요. 처음에는 인터넷 연결이 필요해요.</p>
</section>
<section id="chat" aria-label="대화 기록"></section>
<div class="suggestions" aria-label="추천 질문">
<button type="button" disabled>엣지 AI가 뭐예요?</button>
<button type="button" disabled>작은 모델은 어떻게 만들어요?</button>
<button type="button" disabled>반도체에서 AI는 어떻게 돌아가요?</button>
</div>
<form id="form">
<textarea id="input" rows="2" maxlength="2000" aria-label="질문 입력" placeholder="궁금한 것을 적어 주세요…" disabled></textarea>
<button id="send" type="submit" disabled>보내기 ↗</button>
</form>
<footer>Enter로 전송 · Shift+Enter로 줄바꿈<br>답변은 기기의 GPU에서 생성돼요. 대화는 이 탭을 열어 둔 동안 기억해요.</footer>
</main>
<script>
// 외부 모듈 로딩이 실패해도 WebGPU 미지원 안내를 먼저 표시합니다.
if (!navigator.gpu) {
  document.getElementById("status").textContent = "WebGPU를 지원하지 않아요";
  document.getElementById("detail").textContent = "WebGPU를 사용할 수 있는 브라우저와 기기에서 열어 주세요.";
}
window.addEventListener("error", (event) => {
  if (event.target instanceof HTMLScriptElement && navigator.gpu) {
    document.getElementById("status").textContent = "WebLLM을 불러오지 못했어요";
    document.getElementById("detail").textContent = "인터넷 연결을 확인하고 페이지를 새로고침해 주세요.";
  }
}, true);
</script>
<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.87";

const SYSTEM_PROMPT = `너는 엣지 AI 반도체에 탑재된 AI를 구현하는 방법을 알려주는 친절한 챗봇 'edge AI 반도체 내 탑재 AI'야.
고등학생이 이해할 수 있도록 쉬운 존댓말과 간단한 예시로 설명해.
작은 AI 모델과 반도체의 메모리, 전력 제한을 고려해서 실현 가능한 방법을 안내해.
모르는 사실은 지어내지 말고, 개인정보를 요구하거나 실제로 실행하지 않은 일을 했다고 말하지 마.
3~4문장 이내로 짧게 대답해.`;
const history = [];
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const detail = document.getElementById("detail");
const progress = document.getElementById("progress");
const input = document.getElementById("input");
const form = document.getElementById("form");
const send = document.getElementById("send");
const suggestions = [...document.querySelectorAll(".suggestions button")];
let ready = false;
let busy = false;

function lock(disabled) {
  input.disabled = disabled;
  send.disabled = disabled;
  suggestions.forEach(button => button.disabled = disabled);
}
function bubble(role, text) {
  const row = document.createElement("div");
  row.className = "message " + role;
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "나" : "☁️ edge AI";
  const content = document.createElement("div");
  content.className = "bubble";
  content.textContent = text;
  row.append(label, content);
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
  return content;
}
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
bubble("assistant", "안녕하세요! 엣지 AI와 반도체를 함께 탐구해요. 모델 준비가 끝나면 질문해 주세요 ☁️");

async function start() {
  if (!navigator.gpu) return;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error("사용 가능한 GPU 어댑터가 없어요.");
    const q = adapter.features.has("shader-f16") ? "q4f16_1" : "q4f32_1";
    const engine = await CreateMLCEngine(`Qwen3.5-2B-${q}-MLC`, {
      initProgressCallback: (p) => {
        const percent = Math.round(Math.max(0, Math.min(1, p.progress || 0)) * 100);
        progress.value = percent;
        status.textContent = `모델 준비 중 · ${percent}%`;
        detail.textContent = p.text;
      },
    });
    ready = true;
    progress.value = 100;
    status.textContent = "대화할 준비 완료 · 100%";
    detail.textContent = `Qwen3.5-2B-${q}-MLC · 브라우저에서 실행 중`;
    lock(false);
    input.focus();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!ready || busy || !question) return;
      busy = true;
      lock(true);
      input.value = "";
      bubble("user", question);
      const answer = bubble("assistant", "답변을 생각하고 있어요…");
      history.push({ role: "user", content: question });
      let fullAnswer = "";
      status.textContent = "답변을 만들고 있어요…";
      try {
        const stream = await engine.chat.completions.create({
          messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
          stream: true,
          extra_body: { enable_thinking: false },
          max_tokens: 512,
        });
        for await (const chunk of stream) {
          const piece = chunk.choices[0]?.delta?.content || "";
          // 토큰 조각을 다시 글자 단위로 나눠 표시합니다.
          for (const letter of piece) {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100;
            fullAnswer += letter;
            answer.textContent = fullAnswer;
            if (nearBottom) chat.scrollTop = chat.scrollHeight;
            await delay(12);
          }
        }
        if (!fullAnswer.trim()) throw new Error("빈 답변이 돌아왔어요. 다시 질문해 주세요.");
        history.push({ role: "assistant", content: fullAnswer });
        status.textContent = "답변 완료 · 다음 질문을 해 주세요";
      } catch (error) {
        // 실패한 턴은 다음 요청의 대화 기록에 포함하지 않습니다.
        history.pop();
        answer.textContent = (fullAnswer ? fullAnswer + "\n\n" : "") + "답변을 완료하지 못했어요. 이 질문은 대화 기억에 저장하지 않았어요.";
        status.textContent = "답변 생성 오류";
        detail.textContent = String(error?.message || error);
        input.value = question;
      } finally {
        busy = false;
        lock(!ready);
        input.focus();
      }
    });
  } catch (error) {
    ready = false;
    lock(true);
    status.textContent = "모델을 준비하지 못했어요";
    detail.textContent = String(error?.message || error) + "\n인터넷 연결과 GPU 메모리를 확인하고 새로고침해 주세요. 지정 모델을 이 버전에서 지원하지 않으면 모델 준비가 실패할 수 있어요.";
  }
}
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (ready && !busy) form.requestSubmit();
  }
});
suggestions.forEach(button => button.addEventListener("click", () => {
  if (!ready || busy) return;
  input.value = button.textContent;
  form.requestSubmit();
}));
await start();
</script>
</body>
</html>
